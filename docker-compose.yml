x-backupstic: &backupstic
  image: backupstic:local
  build:
    context: .
    dockerfile: frontend/Dockerfile
  restart: unless-stopped
  init: true
  env_file:
    - ./configs/backup.env
  environment:
    BACKEND_DIR: /app/backend
    BACKUP_BASE: /var/backups
    RESTIC_REPO: /var/backups/restic-repo
    SCRIPTS_DIR: /scripts
  volumes:
    - backup-data:/var/backups
    - ./scripts:/scripts:ro
    - ./data/config-backup/id_ed25519:/run/secrets/config-backup/id_ed25519:ro
    - ./data/config-backup/id_ed25519.pub:/run/secrets/config-backup/id_ed25519.pub:ro
    - ./data/config-backup/known_hosts:/run/secrets/config-backup/known_hosts
  networks:
    - backup-net
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  dashboard:
    <<: *backupstic
    container_name: backupstic-dashboard
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    command:
      - gunicorn
      - --bind=0.0.0.0:5000
      - --workers=2
      - --threads=4
      - --timeout=300
      - --graceful-timeout=30
      - --access-logfile=-
      - --error-logfile=-
      - app:app
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup-cron:
    <<: *backupstic
    container_name: backupstic-cron
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        schedule=/var/backups/schedules.cron
        python3 /scripts/sync-schedules.py
        rm -f /etc/crontabs/root
        ln -s "$${schedule}" /etc/crontabs/root
        exec crond -f -l 8

  backup-monitor:
    <<: *backupstic
    container_name: backupstic-monitor
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          /scripts/monitor.sh
          sleep "$${MONITOR_INTERVAL_SECONDS:-3600}"
        done

  # Optional scratch PostgreSQL used by backup health checks to test-restore
  # SQL dumps. Starts only when the "verify-postgres" profile is enabled
  # (COMPOSE_PROFILES=verify-postgres in .env). It must stay dedicated:
  # restores create and drop databases and roles here. No port is published.
  verify-postgres:
    image: postgres:18-alpine
    container_name: backupstic-verify-postgres
    profiles: ["verify-postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${VERIFY_POSTGRES_PASSWORD:-}
    volumes:
      - verify-pgdata:/var/lib/postgresql
    networks:
      - backup-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backup-data:
    name: backupstic-data
  verify-pgdata:
    name: backupstic-verify-pgdata

networks:
  backup-net:
    driver: bridge
